name: Promote latest image

# release.yml pushes the image under its version tag while the release is
# still a draft; :latest only follows once that release is actually published
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  promote:
    name: Point :latest at the published release
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Retags in the registry without pulling. --prefer-index=false stops buildx
      # wrapping the single-platform manifest in a new index, so :latest keeps the exact
      # digest listed in the release notes
      - name: Tag :latest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docker-plasmoid-api"
          docker buildx imagetools create --prefer-index=false --tag "$image:latest" "$image:${TAG#v}"
          docker buildx imagetools inspect "$image:latest"
